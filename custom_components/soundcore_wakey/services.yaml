sync_time:
  name: Sync time
  description: Wyślij aktualny czas lokalny HA na Soundcore Wakey (BLE).
  fields:
    entry_id:
      name: Config entry ID
      description: Opcjonalne, gdy masz kilka urządzeń.
      example: "01ABCDEF..."
      selector:
        text:
    address:
      name: BLE address
      description: Opcjonalny adres MAC zamiast entry_id.
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
